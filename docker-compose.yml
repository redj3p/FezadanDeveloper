version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fezadano5_site
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backups/db_backup_2026-05-07.sql:/docker-entrypoint-initdb.d/01-init.sql

  php:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SITE_URL: http://localhost:8080
      DB_HOST: db
      DB_NAME: fezadano5_site
      DB_USER: root
      DB_PASS: root
      DB_CHARSET: utf8mb4
      APP_SECURITY_SALT: local-dev-change-me
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
